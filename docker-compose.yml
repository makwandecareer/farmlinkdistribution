services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmlink
      POSTGRES_USER: farmlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - farmlink_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmlink -d farmlink"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  farmlink_db:
