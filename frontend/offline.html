<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#073827">
  <title>FarmLink | Offline</title>
  <style>
    :root{--green:#073827;--gold:#c7922e;--ink:#14221c;--muted:#5f7068}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f2;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
    main{width:min(520px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 22px 65px rgba(3,35,23,.13);text-align:center}
    img{width:170px;max-width:70%;margin:0 auto 24px}
    h1{margin:0 0 12px;font-size:2rem;color:var(--green)}
    p{color:var(--muted);line-height:1.6}
    button{border:0;border-radius:999px;padding:14px 22px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/assets/farmlink-logo.png" alt="FarmLink Distribution">
    <h1>You are offline</h1>
    <p>FarmLink cannot reach the network right now. Previously cached pages may still be available. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
