<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073827">
  <title>Payment Status | FarmLink Distribution</title>
  <link rel="icon" href="/assets/farmlink-logo.png">
  <style>
    :root{--green:#073827;--green2:#0d6547;--gold:#c79a36;--ink:#17201c;--muted:#66736c;--line:#e1e7e3;--bg:#f3f7f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 10%,#e5f1eb,transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
    .card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,52px);box-shadow:0 28px 80px rgba(7,56,39,.14);text-align:center}
    img{width:150px;height:auto;margin-bottom:28px}.icon{width:74px;height:74px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;background:#e6f2ec;color:var(--green2)}
    h1{font-size:clamp(1.9rem,5vw,2.8rem);margin:.2rem 0 .8rem;letter-spacing:-.04em}p{color:var(--muted);line-height:1.65}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0;text-align:left}.detail{padding:14px;border-radius:12px;background:#f7f9f8}.detail span,.detail strong{display:block}.detail span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.detail strong{margin-top:4px;overflow-wrap:anywhere}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.button{display:inline-flex;justify-content:center;text-decoration:none;border-radius:11px;padding:13px 18px;font-weight:850}.primary{background:var(--green);color:#fff}.secondary{border:1px solid var(--line);color:var(--green);background:#fff}.error .icon{background:#fde7e7;color:#a62b2b}.pending .icon{background:#fff3d8;color:#8a6314}
    @media(max-width:520px){.details{grid-template-columns:1fr}.actions{display:grid}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card" id="paymentCard">
    <img src="/assets/farmlink-logo.png" alt="FarmLink Distribution">
    <div class="icon" id="statusIcon">…</div>
    <p style="text-transform:uppercase;letter-spacing:.13em;color:#c08e25;font-size:.7rem;font-weight:900">Secure payment verification</p>
    <h1 id="statusTitle">Checking your payment</h1>
    <p id="statusMessage">Please wait while FarmLink verifies the transaction directly with Paystack.</p>
    <div class="details" id="paymentDetails" hidden>
      <div class="detail"><span>Reference</span><strong id="referenceValue">—</strong></div>
      <div class="detail"><span>Status</span><strong id="statusValue">—</strong></div>
      <div class="detail"><span>Amount</span><strong id="amountValue">—</strong></div>
      <div class="detail"><span>Channel</span><strong id="channelValue">—</strong></div>
    </div>
    <div class="actions">
      <a class="button primary" href="/">Return to FarmLink</a>
      <a class="button secondary" href="tel:+27774573727">Contact support</a>
    </div>
  </main>
  <script src="/payment-success.js?v=corruption-fix-1"></script>
</body>
</html>
